name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test on Node.js ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node:
          - 24.x
          - 26.x
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps
      - name: Build and run the full test suite
        run: npm run check

  release-check:
    name: Verify release package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.x
          cache: npm
      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps
      - name: Run the 2.0 release verification
        run: npm run verify:2.0
      - name: Require the tracked browser bundle to be current
        run: git diff --exit-code -- dist/client.js
      - name: Verify panel close buttons outside desktop window controls
        run: node scripts/verify-shell-titlebar-browser.mjs
      - name: Verify rollback navigation in Chrome
        run: node scripts/verify-playthrough-rollback-browser.mjs
      - name: Verify recovery commands on the supported DSH Host
        env:
          DSH_TAVERN_PROMPT_COMPAT_ROOT: ${{ runner.temp }}/tavern-official-host
        run: |
          npm install --prefix "$DSH_TAVERN_PROMPT_COMPAT_ROOT" --legacy-peer-deps --ignore-scripts --no-audit --no-fund @deepseek-ai/dsh@0.2.2-rc.1
          node --test test/maintenance-tools-host.test.mjs test/draft-native-controls-host.test.mjs
      - name: Audit production dependencies
        run: npm audit --omit=dev
